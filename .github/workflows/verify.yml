name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: swedishpolls
          POSTGRES_USER: swedishpolls
          POSTGRES_PASSWORD: integration-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U swedishpolls -d swedishpolls"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_PASSWORD: integration-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
  fallow:
    name: Fallow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: fallow-rs/fallow@c55ba1ba3c98c6e4ad48f0aed0e0f256c256d959 # v3.23.0
        with:
          version: '3.23.0'
          command: audit
          root: frontend
          config: frontend/.fallowrc.json
          changed-since: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          auto-changed-since: 'false'
          gate: all
          fail-on-issues: 'true'
          dead-code-baseline: baselines/dead-code.json
          health-baseline: baselines/health.json
          dupes-baseline: baselines/dupes.json
          format: json
          artifacts-dir: fallow-reports
          comment: 'false'
          annotations: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fallow-reports
          path: fallow-reports/
          if-no-files-found: error
