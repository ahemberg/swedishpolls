name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build and integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
  fallow:
    name: Fallow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - uses: fallow-rs/fallow@c55ba1ba3c98c6e4ad48f0aed0e0f256c256d959 # v3.23.0
        with:
          version: '3.23.0'
          command: audit
          root: frontend
          config: frontend/.fallowrc.json
          changed-since: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          auto-changed-since: 'false'
          gate: all
          fail-on-issues: 'true'
          dead-code-baseline: baselines/dead-code.json
          health-baseline: baselines/health.json
          dupes-baseline: baselines/dupes.json
          format: json
          artifacts-dir: fallow-reports
          comment: 'false'
          annotations: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fallow-reports
          path: fallow-reports/
          if-no-files-found: error
