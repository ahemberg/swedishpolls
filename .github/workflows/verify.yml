name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
      - name: Upload verified application classes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-classes
          path: target/classes/
          # The Vite manifest lives in the hidden static/.vite directory. Without this the
          # artifact carries the bundle but not the manifest, and the image serves every page
          # with no script and no stylesheet.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  model-validation:
    name: Model validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether model validation is required
        id: required
        env:
          BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          required=true
          if [ -n "$BASE" ] && git rev-parse --verify --quiet "$BASE^{commit}"; then
            changed=$(git diff --name-only "$BASE" HEAD) || { echo "required=true" >>"$GITHUB_OUTPUT"; exit 0; }
            model_pattern='^src/main/java/se/swedishpolls/(estimation|model|source)/|^src/test/java/se/swedishpolls/(estimation|source|testsupport)/|^src/main/resources/|^docs/validation/|\.github/workflows/verify\.yml|^pom\.xml$'
            if ! printf '%s\n' "$changed" | grep -E "$model_pattern" >/dev/null; then
              required=false
            fi
          fi
          echo "required=$required" >>"$GITHUB_OUTPUT"
      - name: Set up Java
        if: steps.required.outputs.required == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Run model validation
        if: steps.required.outputs.required == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress -Pmodel-validation verify
  fallow:
    name: Fallow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - uses: fallow-rs/fallow@30167b42257ded3bef683f6c91b4aa4017a1ff59 # v3.25.0
        with:
          version: '3.25.0'
          command: audit
          root: frontend
          config: frontend/.fallowrc.json
          changed-since: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          auto-changed-since: 'false'
          gate: all
          fail-on-issues: 'true'
          dead-code-baseline: baselines/dead-code.json
          health-baseline: baselines/health.json
          dupes-baseline: baselines/dupes.json
          format: json
          artifacts-dir: fallow-reports
          comment: 'false'
          annotations: 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fallow-reports
          path: fallow-reports/
          if-no-files-found: error
  images:
    name: Build, verify and publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, fallow, model-validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25.0.4+7.0.LTS'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
          platforms: arm64
      - name: Download verified application classes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-classes
          path: target/classes
          run-id: ${{ github.run_id }}
      - name: Build exact architecture images from the verified classes
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -Pdocker
          -Dimage.version=${GITHUB_SHA}
          io.github.git-commit-id:git-commit-id-maven-plugin:revision
          jib:dockerBuild@amd64 jib:dockerBuild@arm64
      - name: Verify Compose
        env:
          APP_VERSION: ${{ github.sha }}
          DATABASE_PASSWORD: compose-smoke-password
          POLLS_INGEST_ENABLED: 'false'
          PUBLIC_ORIGIN: https://polls.example
          SITE_NAME: Swedish Polls smoke test
        run: |
          mkdir -p target/compose-smoke
          project=
          cleanup() {
            status=$?
            if [ -n "$project" ]; then
              docker compose --project-name "$project" logs --no-color \
                >"target/compose-smoke/${ARCH}.log" 2>&1 || true
              docker compose --project-name "$project" down --volumes || true
            fi
            exit "$status"
          }
          BASE_URL=http://127.0.0.1:8080
          wait_for_app() {
            for attempt in $(seq 1 120); do
              if curl --fail --silent "$BASE_URL/" >/dev/null; then return; fi
              sleep 1
            done
            return 1
          }
          # The image can serve every route and still carry no compiled frontend, because a
          # missing Vite manifest makes the page omit its own script and stylesheet silently.
          # Assert the served overview references both, and that each one is fetchable. The
          # entry can pull in more than one stylesheet, so every one of them is checked.
          check_frontend() {
            home_html=$(curl --fail --silent "$BASE_URL/")
            script_path=$(printf '%s' "$home_html" |
              grep -o '<script type="module" src="[^"]*"' |
              sed 's/.*src="//; s/"$//')
            stylesheet_paths=$(printf '%s' "$home_html" |
              grep -o '<link rel="stylesheet" href="[^"]*"' |
              sed 's/.*href="//; s/"$//')
            if [ -z "$script_path" ] || [ -z "$stylesheet_paths" ]; then
              echo "The served overview carries no module script or no stylesheet" >&2
              return 1
            fi
            curl --fail --silent "${BASE_URL}${script_path}" >/dev/null
            printf '%s\n' "$stylesheet_paths" | while read -r stylesheet_path; do
              curl --fail --silent "${BASE_URL}${stylesheet_path}" >/dev/null || exit 1
            done
          }
          trap cleanup EXIT
          for ARCH in amd64 arm64; do
            export ARCH
            project="swedishpolls-${ARCH}"
            for base in \
              postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636; do
              id=$(docker image inspect --format '{{.Id}}' "$base" 2>/dev/null || true)
              if [ -n "$id" ]; then docker image rm "$id"; fi
            done
            docker compose --project-name "$project" up --detach --wait
            wait_for_app
            check_frontend
            docker compose --project-name "$project" logs --no-color \
              >"target/compose-smoke/${ARCH}.log"
            docker compose --project-name "$project" down --volumes
            project=
          done
          trap - EXIT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compose-smoke
          path: target/compose-smoke/
          if-no-files-found: error
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-tagged images
        run: |
          docker push "ghcr.io/ahemberg/swedishpolls:${GITHUB_SHA}-amd64"
          docker push "ghcr.io/ahemberg/swedishpolls:${GITHUB_SHA}-arm64"
