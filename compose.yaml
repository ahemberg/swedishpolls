services:
  app:
    image: ghcr.io/ahemberg/swedishpolls:${APP_VERSION:?Set APP_VERSION}-${ARCH:?Set ARCH to amd64 or arm64}
    platform: linux/${ARCH}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/swedishpolls
      DATABASE_USER: swedishpolls
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      SITE_NAME: ${SITE_NAME:?Set SITE_NAME}
      POLLS_INGEST_ENABLED: ${POLLS_INGEST_ENABLED:-true}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
  db:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    platform: linux/${ARCH}
    restart: unless-stopped
    environment:
      POSTGRES_DB: swedishpolls
      POSTGRES_USER: swedishpolls
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swedishpolls -d swedishpolls"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/postgresql
volumes:
  database:
