spring.application.name=swedishpolls
spring.config.import=optional:file:.env[.properties]
spring.docker.compose.file=compose.dev.yaml
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:${DATABASE_PORT:5432}/swedishpolls}
spring.datasource.username=${DATABASE_USER:swedishpolls}
spring.datasource.password=${DATABASE_PASSWORD}
server.port=${APP_PORT:8080}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
polls.source-url=https://raw.githubusercontent.com/MansMeg/SwedishPolls/master/Data/Polls.csv
spring.http.serviceclient.poll-source.base-url=${polls.source-url}
spring.http.serviceclient.poll-source.connect-timeout=10s
spring.http.serviceclient.poll-source.read-timeout=30s
spring.http.serviceclient.poll-source.redirects=dont-follow
site.origin=${PUBLIC_ORIGIN:https://localhost}
site.name=${SITE_NAME:}
